name: Build Releases

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: image-agent-portable-windows
            ext: .exe
          - os: macos-latest
            artifact_name: image-agent-portable-macos
            ext: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-portable.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller image_agent_portable.spec --distpath dist --workpath build --noconfirm

      - name: Add launcher scripts
        shell: bash
        run: |
          cd dist/image-agent-portable
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cat > "运行.bat" << 'BATEOF'
          @echo off
          chcp 65001 >nul
          title Image Generation Agent
          cd /d "%~dp0"
          echo Starting server...
          start "" http://localhost:8000
          image-agent-portable.exe
          pause
          BATEOF
          else
            chmod +x image-agent-portable
            cat > "run.command" << 'SHEOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          echo "Starting server..."
          sleep 1 && open http://localhost:8000 2>/dev/null &
          ./image-agent-portable
          SHEOF
            chmod +x run.command
          fi

      - name: Package artifact
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "${{ matrix.artifact_name }}.zip" image-agent-portable/
          else
            zip -r "${{ matrix.artifact_name }}.zip" image-agent-portable/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip
