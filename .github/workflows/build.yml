name: Build Releases

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: image-agent-portable-windows
          - os: macos-latest
            artifact_name: image-agent-portable-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-portable.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller app.py \
            --onedir \
            --console \
            --name image-agent-portable \
            --add-data "static/index.html:static" \
            --hidden-import langgraph \
            --hidden-import langgraph.graph \
            --hidden-import langgraph.checkpoint.memory \
            --hidden-import langchain \
            --hidden-import langchain_core \
            --hidden-import langchain_openai \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import starlette \
            --hidden-import fastapi \
            --hidden-import aiosqlite \
            --hidden-import httpx \
            --hidden-import aiofiles \
            --hidden-import PIL \
            --hidden-import tenacity \
            --hidden-import multipart \
            --hidden-import pydantic \
            --hidden-import pydantic_settings \
            --hidden-import services.sdxl \
            --hidden-import services.anime \
            --hidden-import services.doubao \
            --hidden-import services.face3d \
            --hidden-import services.glm \
            --hidden-import services.hunyuan \
            --hidden-import services.llm \
            --hidden-import services.modelscope \
            --hidden-import services.pollinations \
            --hidden-import services.qianfan \
            --hidden-import services.runninghub \
            --hidden-import services.scorer \
            --hidden-import services.spark \
            --hidden-import services.stability \
            --hidden-import services.wan26 \
            --hidden-import nodes.prompt \
            --hidden-import nodes.router \
            --hidden-import nodes.generator \
            --hidden-import nodes.critic \
            --hidden-import nodes.decision \
            --hidden-import config \
            --hidden-import state \
            --hidden-import stats \
            --hidden-import db \
            --hidden-import key_manager \
            --hidden-import graph \
            --exclude-module torch \
            --exclude-module torchvision \
            --exclude-module open_clip \
            --exclude-module diffusers \
            --exclude-module accelerate \
            --exclude-module safetensors \
            --exclude-module transformers \
            --noconfirm

      - name: Add launcher (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist/image-agent-portable
          chmod +x image-agent-portable
          cat > run.command << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          echo "Starting server..."
          sleep 1 && open http://localhost:8000 2>/dev/null &
          ./image-agent-portable
          EOF
          chmod +x run.command

      - name: Add launcher (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist/image-agent-portable
          @"
          @echo off
          chcp 65001 >nul
          title Image Generation Agent
          cd /d "%~dp0"
          echo Starting server...
          start "" http://localhost:8000
          image-agent-portable.exe
          pause
          "@ | Out-File -FilePath "运行.bat" -Encoding utf8

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "${{ matrix.artifact_name }}.zip" image-agent-portable/

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path image-agent-portable -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip
